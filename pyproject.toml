[project]
name = "threebody-jepa"
version = "0.1.0"
description = "Does a JEPA latent-prediction objective recover the structure of chaotic n-body dynamics? A controlled benchmark against a Hamiltonian ceiling and a regression floor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.20.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "rebound>=5.0.0",
    "scipy>=1.14.0",
    "torch>=2.12.0",
]
